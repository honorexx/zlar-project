services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zlar
      MYSQL_USER: zlar
      MYSQL_PASSWORD: zlar_local_password
      MYSQL_ROOT_PASSWORD: zlar_root_password
    volumes:
      - zlar_mysql_data:/var/lib/mysql
      - ./database_zlar.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: zlar
      MYSQL_USER: zlar
      MYSQL_PASSWORD: zlar_local_password
    ports:
      - "127.0.0.1:${ZLAR_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  zlar_mysql_data:
