<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do prestador | Zlar</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" type="image/jpeg" href="../assets/img/favicon-zlar.jpeg">
</head>

<body>
  <header class="zlar-header">
    <a class="zlar-logo" href="login.html">
      <span class="brand-lockup">
        <img class="zlar-symbol-img" src="../assets/img/zlar-logo-nova.jpeg" alt="Zlar">
        <span class="brand-text">
          <span>ZLAR</span>
          <small>Prestador</small>
        </span>
      </span>
    </a>
    <nav class="header-nav">
      <a class="active" href="login.html">Login</a>
      <a href="cadastro.html">Cadastro</a>
      <a href="../morador/login.html">Morador</a>
      <a href="../admin/login.html">Admin</a>
    </nav>
  </header>
  <main class="page-wrap auth-wrap">
    <section class="card auth-card">
      <div class="page-tag">Prestador</div>
      <h1 class="page-title">Entrar como prestador</h1>
      <p class="page-subtitle">Acesse chamados, agenda e financeiro.</p>
      <div id="alertLoginPrestador" class="alert"></div>
      <form class="form-grid cols-1" onsubmit="loginHtml(event, 'prestador')">
        <div class="field">
          <label for="lp-email">E-mail</label>
          <input type="email" id="lp-email" required>
        </div>
        <div class="field">
          <label for="lp-senha">Senha</label>
          <input type="password" id="lp-senha" required>
        </div>
        <div class="actions-row">
          <a class="btn btn-ghost" href="esqueci-senha.html">Esqueci a senha</a>
          <a class="btn btn-secondary" href="cadastro.html">Me cadastrar</a>
          <button class="btn btn-primary" type="submit">Entrar</button>
        </div>
      </form>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="../assets/js/script.js?v=20260603-loopback-redirect"></script>
</body>
</html>
