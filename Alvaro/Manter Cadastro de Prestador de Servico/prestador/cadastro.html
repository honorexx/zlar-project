<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro do prestador | Zlar</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" type="image/jpeg" href="../assets/img/favicon-zlar.jpeg">
</head>
<body>
  <header class="zlar-header"><a class="zlar-logo" href="login.html"><span class="brand-lockup"><img class="zlar-symbol-img" src="../assets/img/zlar-logo-nova.jpeg" alt="Zlar"><span class="brand-text"><span>ZLAR</span><small>Prestador</small></span></span></a><nav class="header-nav"><a href="login.html">Login</a><a class="active" href="cadastro.html">Cadastro</a><a href="painel.html">Painel</a></nav></header>
  <main class="page-wrap"><div class="page-title-block"><div class="page-tag">Prestador</div><h1 class="page-title">Criar perfil profissional</h1><p class="page-subtitle">Escolha sua area de atendimento para receber apenas chamados compatíveis.</p></div><section class="card"><form class="form-grid" onsubmit="cadastrarPrestadorHtml(event)"><div class="field col-span-2"><label>Nome completo <span class="req">*</span></label><input id="prestador-nome" type="text" required minlength="3" placeholder="Ex.: Carlos Henrique Souza" title="Informe nome e sobrenome"></div><div class="field"><label>Servico <span class="req">*</span></label><select id="prestador-servico" required title="Escolha a area de atendimento"><option>Limpeza pesada</option><option>Limpeza diaria</option><option>Baba</option><option>Cuidador de idosos</option></select></div><div class="field"><label>Telefone <span class="req">*</span></label><input id="prestador-telefone" type="tel" oninput="maskTel(this)" required pattern="\(\d{2}\) \d{4,5}-\d{4}" placeholder="(41) 99999-0000" title="Formato: (00) 00000-0000"></div><div class="field"><label>E-mail <span class="req">*</span></label><input id="prestador-email" type="email" required placeholder="prestador@email.com" title="Use um e-mail valido"></div><div class="field"><label>Data de nascimento <span class="req">*</span></label><input id="prestador-nascimento" type="date" required title="Nao pode ser uma data futura"></div><div class="field"><label>Senha <span class="req">*</span></label><input id="prestador-senha" type="password" required minlength="8" pattern="(?=.*[A-Z])(?=.*\d).{8,}" placeholder="Minimo 8, maiuscula e numero" title="Minimo 8 caracteres, com uma letra maiuscula e um numero"></div><div class="field"><label>Confirmar senha <span class="req">*</span></label><input id="prestador-confirmar-senha" type="password" required minlength="8" placeholder="Repita a senha" title="Repita exatamente a senha informada"></div><div class="field col-span-2"><label>Descricao</label><textarea id="prestador-descricao" placeholder="Conte sua experiencia e disponibilidade"></textarea></div><div class="actions-row col-span-2"><a class="btn btn-ghost" href="login.html">Voltar</a><button class="btn btn-primary" type="submit">Cadastrar</button></div></form></section></main>
  <div class="toast" id="toast"></div><script src="../assets/js/script.js"></script>
</body>
</html>
