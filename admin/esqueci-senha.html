<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar acesso admin | Zlar</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" type="image/jpeg" href="../assets/img/favicon-zlar.jpeg">
</head>

<body>
  <header class="zlar-header">
    <a class="zlar-logo" href="login.html">
      <span class="brand-lockup">
        <img class="zlar-symbol-img" src="../assets/img/zlar-logo-nova.jpeg" alt="Zlar">
        <span class="brand-text">
          <span>ZLAR</span>
          <small>Admin</small>
        </span>
      </span>
    </a>
    <nav class="header-nav">
      <a href="login.html">Login</a>
    </nav>
  </header>
  <main class="page-wrap auth-wrap">
    <section class="card auth-card">
      <div class="page-tag">Admin</div>
      <h1 class="page-title">Recuperar acesso</h1>
      <p class="page-subtitle">Gere um código temporário usando seu usuário ou e-mail administrativo.</p>
      <form class="form-grid cols-1" onsubmit="esqueciSenhaHtml(event, 'admin')">
        <div class="field"><label>Usuário ou e-mail</label><input id="rec-email" required></div>
        <div class="actions-row"><button class="btn btn-primary" type="submit">Gerar código</button><a class="btn btn-ghost" href="login.html">Voltar</a></div>
      </form>
      <div class="recovery-code" id="rec-codigo-gerado"></div>
      <form class="form-grid cols-1" id="reset-password-form" style="display:none" onsubmit="redefinirSenhaHtml(event, 'admin')">
        <div class="field"><label>Código temporário</label><input id="rec-codigo" required maxlength="6"></div>
        <div class="field"><label>Novo código de acesso</label><input id="rec-nova-senha" type="password" required minlength="6"></div>
        <div class="field"><label>Confirmar código</label><input id="rec-confirmar-senha" type="password" required minlength="6"></div>
        <button class="btn btn-primary" type="submit">Trocar código</button>
      </form>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="../assets/js/script.js?v=20260917-review"></script>
</body>
</html>
