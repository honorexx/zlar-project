<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prestadores | Zlar</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" type="image/jpeg" href="../assets/img/favicon-zlar.jpeg">
</head>

<body>
  <header class="zlar-header">
    <a class="zlar-logo" href="painel.html">
      <span class="brand-lockup">
        <img class="zlar-symbol-img" src="../assets/img/zlar-logo-nova.jpeg" alt="Zlar">
        <span class="brand-text">
          <span>ZLAR</span>
          <small>Admin</small>
        </span>
      </span>
    </a>
    <nav class="header-nav">
      <a href="painel.html">Painel</a>
      <a href="moradores.html">Moradores</a>
      <a class="active" href="prestadores.html">Prestadores</a>
      <a href="equipe.html">Equipe</a>
      <a href="suporte.html">Suporte</a>
    </nav>
  </header>
  <main class="page-wrap">
    <div class="page-title-block">
      <div class="page-tag">Admin</div>
      <h1 class="page-title">Prestadores</h1>
      <p class="page-subtitle">Edite dados, aprove, bloqueie ou exclua profissionais.</p>
    </div>
    <section class="card admin-edit-panel" id="admin-user-panel" style="display:none">
      <div class="section-label">Editar prestador</div>
      <form class="form-grid" onsubmit="salvarAdminUsuario(event)">
        <input type="hidden" id="admin-user-tipo" value="prestador">
        <input type="hidden" id="admin-user-id">
        <div class="field col-span-2">
          <label>Nome</label>
          <input id="admin-user-nome" type="text" required>
        </div>
        <div class="field">
          <label>E-mail</label>
          <input id="admin-user-email" type="email" required>
        </div>
        <div class="field">
          <label>Telefone</label>
          <input id="admin-user-telefone" type="tel" oninput="maskTel(this)" required>
        </div>
        <div class="field">
          <label>Servico</label>
          <select id="admin-user-servico" required>
            <option>Limpeza pesada</option>
            <option>Limpeza diaria</option>
            <option>Baba</option>
            <option>Cuidador de idosos</option>
          </select>
        </div>
        <div class="field">
          <label>Status usuario</label>
          <select id="admin-user-status">
            <option value="ativo">Ativo</option>
            <option value="inativo">Inativo</option>
            <option value="bloqueado">Bloqueado</option>
          </select>
        </div>
        <div class="field">
          <label>Aprovacao</label>
          <select id="admin-user-status-aprovacao">
            <option value="em_analise">Em analise</option>
            <option value="aprovado">Aprovado</option>
            <option value="reprovado">Reprovado</option>
            <option value="bloqueado">Bloqueado</option>
          </select>
        </div>
        <div class="field col-span-2">
          <label>Descricao</label>
          <textarea id="admin-user-descricao"></textarea>
        </div>
        <div class="actions-row col-span-2 actions-row-end">
          <button class="btn btn-ghost" type="button" onclick="cancelarAdminUsuario()">Cancelar</button>
          <button class="btn btn-primary" type="submit">Salvar alteracoes</button>
        </div>
      </form>
    </section>
    <section class="card table-card">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Servico</th>
            <th>Telefone</th>
            <th>Status</th>
            <th>Aprovacao</th>
            <th>Acoes</th>
          </tr>
        </thead>
        <tbody id="tbPrestadoresAdmin">
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <h3>Nenhum prestador cadastrado</h3>
                <p>Os cadastros feitos aparecem aqui.</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="../assets/js/script.js"></script>
</body>
</html>
