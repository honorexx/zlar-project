<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipe | Zlar</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" type="image/jpeg" href="../assets/img/favicon-zlar.jpeg">
</head>

<body>
  <header class="zlar-header">
    <a class="zlar-logo" href="painel.html">
      <span class="brand-lockup">
        <img class="zlar-symbol-img" src="../assets/img/zlar-logo-nova.jpeg" alt="Zlar">
        <span class="brand-text">
          <span>ZLAR</span>
          <small>Admin</small>
        </span>
      </span>
    </a>
    <nav class="header-nav">
      <a href="painel.html">Painel</a>
      <a href="moradores.html">Moradores</a>
      <a href="prestadores.html">Prestadores</a>
      <a class="active" href="equipe.html">Equipe</a>
    </nav>
  </header>
  <main class="page-wrap">
    <div class="page-title-block">
      <div class="page-tag">Admin</div>
      <h1 class="page-title">Equipe de suporte</h1>
      <p class="page-subtitle">Cadastro da equipe interna.</p>
    </div>
    <section class="card">
      <form class="form-grid" onsubmit="cadastrarEquipeHtml(event)">
        <div class="field col-span-2">
          <label>Nome</label>
          <input id="eq-html-nome" required>
        </div>
        <div class="field">
          <label>E-mail</label>
          <input id="eq-html-email" type="email" required>
        </div>
        <div class="field">
          <label>Cargo</label>
          <select id="eq-html-cargo">
            <option>Suporte</option>
            <option>Supervisor</option>
            <option>Administrador</option>
          </select>
        </div>
        <div class="actions-row col-span-2 actions-row-end">
          <button class="btn btn-primary">Cadastrar membro</button>
        </div>
      </form>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="../assets/js/script.js?v=20260603-loopback-redirect"></script>
</body>
</html>
